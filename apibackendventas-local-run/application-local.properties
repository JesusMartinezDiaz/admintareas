# Perfil de desarrollo local para apibackendventas.
#
# El application.properties real usa spring.datasource.jndi-name=java:/Blade,
# es decir, espera que un servidor de aplicaciones (WildFly/JBoss) le
# inyecte el datasource "Blade" ya configurado. Fuera de ese servidor
# (por ejemplo corriendo el WAR directo con `java -jar` para desarrollo
# local), esa propiedad no sirve - hace falta un datasource JDBC directo,
# que es lo que agrega este archivo.
#
# Uso (desde la carpeta del proyecto apibackendventas):
#   mvn -q -DskipTests package
#   java -jar target/apibackendventas-0.0.1-SNAPSHOT.war --spring.profiles.active=local
#
# Copia este archivo a src/main/resources/application-local.properties
# de TU proyecto apibackendventas (no lo pisa, application.properties
# se sigue leyendo primero; este solo agrega/sobreescribe el datasource).

# Poner spring.datasource.jndi-name="" NO alcanza: Spring Boot considera la
# propiedad "presente" (aunque vacía) y de todos modos activa
# JndiDataSourceAutoConfiguration en vez de la de JDBC normal. Hay que
# excluirla explícitamente.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.url=jdbc:mysql://localhost:3306/biochem_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=cobranza_ia_app
spring.datasource.password=localdev123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
