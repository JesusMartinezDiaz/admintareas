<div class="card-body">

  <h4 class="mb-1">Cobranza IA · Agente de datos de cartera</h4>
  <p class="text-muted">Pregúntale sobre antigüedad de saldos, clientes con más deuda, alertas abiertas o el avance de los bloques activos.</p>

  <div class="card border-0 shadow-sm chat-card">
    <div class="card-body d-flex flex-column">

      <div class="turnos flex-grow-1">
        <div class="turno" *ngFor="let t of turnos" [class.io]="t.autor === 'IA'">
          <strong>{{ t.autor === 'IA' ? 'Agente IA' : 'Tú' }}</strong>
          <p class="mb-0">{{ t.texto }}</p>
        </div>
        <div class="turno io" *ngIf="enviando"><em>Consultando la cartera...</em></div>
      </div>

      <div class="d-flex mt-3">
        <input
          class="form-control mr-2"
          [(ngModel)]="pregunta"
          (keydown.enter)="enviar()"
          placeholder="ej. ¿Cuáles son los 5 clientes con más saldo vencido en la ruta 12?" />
        <button class="btn btn-primary" (click)="enviar()" [disabled]="enviando">Enviar</button>
      </div>

    </div>
  </div>

</div>
