<h2>Agente IA de cartera</h2>
<p class="hint">Pregúntale sobre antigüedad de saldos, clientes con más deuda, alertas abiertas o el avance de los bloques activos.</p>

<div class="card chat">
  <div class="turnos">
    @for (t of turnos(); track $index) {
      <div class="turno" [class.io]="t.autor === 'IA'">
        <strong>{{ t.autor === 'IA' ? 'Agente IA' : 'Tú' }}</strong>
        <p>{{ t.texto }}</p>
      </div>
    }
    @if (enviando()) {
      <div class="turno io"><em>Consultando la cartera...</em></div>
    }
  </div>

  <div class="entrada">
    <input
      [(ngModel)]="pregunta"
      (keydown.enter)="enviar()"
      placeholder="ej. ¿Cuáles son los 5 clientes con más saldo vencido en la ruta 12?"
    />
    <button (click)="enviar()" [disabled]="enviando()">Enviar</button>
  </div>
</div>
